<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>浅海 · Ocean Shallows</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--glass:rgba(255,255,255,.16);--glass-b:rgba(255,255,255,.32);--ink:#fff;--ink2:rgba(255,255,255,.72);--acc:#7ff3e2}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#04203a;font-family:'Noto Sans SC',system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{transition:opacity .45s ease,transform .45s ease}
body.hide-ui .ui{opacity:0;pointer-events:none}
body.hide-ui #cards{transform:translate(-50%,30px)}
.glass{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);box-shadow:0 8px 30px rgba(0,20,40,.25)}
#title{position:fixed;left:max(18px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));pointer-events:none;z-index:5}
#title h1{font-family:'Noto Serif SC',serif;font-weight:700;font-size:30px;letter-spacing:.12em;text-shadow:0 2px 12px rgba(0,30,60,.55),0 0 2px rgba(0,0,0,.3)}
#title h1 small{font-family:'Noto Serif SC',serif;font-weight:500;font-size:15px;letter-spacing:.08em;opacity:.85;margin-left:.4em}
#counter{margin-top:6px;font-size:13px;color:var(--ink2);text-shadow:0 1px 6px rgba(0,30,60,.6);letter-spacing:.04em}
#bar{position:fixed;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:6}
#ctrls{display:flex;gap:4px;padding:5px;border-radius:14px;flex-wrap:wrap;justify-content:flex-end}
.btn{appearance:none;border:0;background:transparent;color:var(--ink);font:500 13px 'Noto Sans SC',sans-serif;padding:7px 10px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;transition:background .2s}
.btn:hover{background:rgba(255,255,255,.14)}
.btn.on{background:rgba(127,243,226,.28);box-shadow:inset 0 0 0 1px rgba(127,243,226,.6)}
.btn .ic{font-size:15px;line-height:1}
.btn kbd{font:11px 'Noto Sans SC',sans-serif;opacity:.55;border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:0 3px}
#scenes{display:flex;gap:6px;padding:6px;border-radius:14px}
.scn{width:74px;border:0;background:transparent;color:var(--ink);cursor:pointer;border-radius:10px;padding:3px;font:12px 'Noto Sans SC',sans-serif;transition:background .2s,box-shadow .2s}
.scn img{display:block;width:100%;height:42px;object-fit:cover;border-radius:7px;background:#1a5070}
.scn span{display:block;margin-top:3px;text-align:center;opacity:.85}
.scn.on{background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1.5px var(--acc)}
#cards{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:10px;padding:10px;border-radius:20px;z-index:6;max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}
#cards::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:96px;padding:6px 6px 8px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);cursor:grab;text-align:center;transition:transform .2s,background .2s;touch-action:none}
.card:hover{transform:translateY(-4px);background:rgba(255,255,255,.18)}
.card:active{cursor:grabbing}
.card canvas{display:block;width:84px;height:84px;border-radius:10px;background:radial-gradient(circle at 50% 40%,rgba(120,220,230,.35),rgba(10,60,110,.45))}
.card b{display:block;margin-top:5px;font-weight:500;font-size:13px}
.card i{display:block;font-style:italic;font-size:10px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vortex{position:fixed;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:2px dashed rgba(255,255,255,.75);display:none;cursor:move;z-index:4;touch-action:none;animation:spin 3s linear infinite;box-shadow:0 0 18px rgba(127,243,226,.4)}
#vortex::after{content:'';position:absolute;inset:22px;border-radius:50%;background:rgba(255,255,255,.8)}
#vortex.on{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,10px);padding:9px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}
#showui{position:fixed;right:14px;bottom:14px;z-index:7;display:none;border-radius:12px}
body.hide-ui #showui{display:flex}
#ghost{position:fixed;pointer-events:none;z-index:8;display:none}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:16px;padding:30px;text-align:center;background:#04203a;z-index:20}
@media (max-width:640px){
  #title h1{font-size:22px}#title h1 small{display:block;font-size:12px;margin:2px 0 0}
  #counter{font-size:12px}
  #bar{left:10px;right:10px;top:auto;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 124px);align-items:stretch}
  #ctrls{justify-content:center;gap:1px;padding:4px}
  .btn{padding:6px 5px;font-size:12px;gap:3px}.btn kbd{display:none}.btn .ic{font-size:13px}
  #scenes{justify-content:center}.scn{width:23%}.scn img{height:34px}
  #cards{bottom:max(8px,env(safe-area-inset-bottom));gap:7px;padding:7px;left:8px;right:8px;transform:none;max-width:none}
  body.hide-ui #cards{transform:translateY(30px)}
  .card{width:76px}.card canvas{width:64px;height:64px}.card b{font-size:12px}
}
@media (max-width:640px) and (max-height:700px){#bar{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 112px)}#scenes .scn span{display:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="title" class="ui"><h1>浅海<small>· Ocean Shallows</small></h1><div id="counter">海面空空如也</div></div>
<div id="bar" class="ui">
  <div id="ctrls" class="glass">
    <button class="btn" id="b-rain" title="下雨 (R)"><span class="ic">🌧</span>下雨<kbd>R</kbd></button>
    <button class="btn" id="b-vortex" title="漩涡 (W)"><span class="ic">🌀</span>漩涡<kbd>W</kbd></button>
    <button class="btn" id="b-calm" title="平静 (C)"><span class="ic">〰</span>平静<kbd>C</kbd></button>
    <button class="btn" id="b-clear" title="清空海面"><span class="ic">✕</span>清空</button>
    <button class="btn" id="b-sound" title="声音 (M)"><span class="ic">🔇</span>声音<kbd>M</kbd></button>
    <button class="btn" id="b-hide" title="隐藏界面 (H)"><span class="ic">👁</span>隐藏<kbd>H</kbd></button>
  </div>
  <div id="scenes" class="glass">
    <button class="scn on" data-i="0"><img alt=""><span>热带浅滩</span></button>
    <button class="scn" data-i="1"><img alt=""><span>珊瑚潟湖</span></button>
    <button class="scn" data-i="2"><img alt=""><span>黄昏海湾</span></button>
    <button class="scn" data-i="3"><img alt=""><span>月夜荧光</span></button>
  </div>
</div>
<div id="cards" class="ui glass">
  <div class="card" data-t="manta"><canvas width="128" height="128"></canvas><b>蝠鲼</b><i>Mobula birostris</i></div>
  <div class="card" data-t="eagle"><canvas width="128" height="128"></canvas><b>斑点鹞鲼</b><i>Aetobatus narinari</i></div>
  <div class="card" data-t="stingray"><canvas width="128" height="128"></canvas><b>蓝点魟</b><i>Taeniura lymma</i></div>
  <div class="card" data-t="moon"><canvas width="128" height="128"></canvas><b>海月水母</b><i>Aurelia aurita</i></div>
  <div class="card" data-t="nettle"><canvas width="128" height="128"></canvas><b>金黄水母</b><i>Chrysaora fuscescens</i></div>
  <div class="card" data-t="shark"><canvas width="128" height="128"></canvas><b>黑鳍礁鲨</b><i>Carcharhinus melanopterus</i></div>
</div>
<div id="vortex"></div>
<button id="showui" class="btn glass"><span class="ic">👁</span>显示界面</button>
<div id="toast" class="glass"></div>
<div id="err">你的浏览器不支持 WebGL，无法显示这片海。</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
