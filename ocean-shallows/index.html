<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>浅海 · Ocean Shallows</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--glass:rgba(255,255,255,.16);--glass-b:rgba(255,255,255,.32);--ink:#fff;--ink2:rgba(255,255,255,.72);--acc:#7ff3e2}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#04203a;font-family:'Noto Sans SC',system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{transition:opacity .45s ease,transform .45s ease}
body.hide-ui .ui{opacity:0;pointer-events:none}
body.hide-ui #cards{transform:translate(-50%,30px)}
.glass{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);box-shadow:0 8px 30px rgba(0,20,40,.25)}
#title{position:fixed;left:max(18px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));pointer-events:none;z-index:5}
#title h1{font-family:'Noto Serif SC',serif;font-weight:700;font-size:30px;letter-spacing:.12em;text-shadow:0 2px 12px rgba(0,30,60,.55),0 0 2px rgba(0,0,0,.3)}
#title h1 small{font-family:'Noto Serif SC',serif;font-weight:500;font-size:15px;letter-spacing:.08em;opacity:.85;margin-left:.4em}
#counter{margin-top:6px;font-size:13px;color:var(--ink2);text-shadow:0 1px 6px rgba(0,30,60,.6);letter-spacing:.04em}
#bar{position:fixed;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:6}
#ctrls{display:flex;gap:4px;padding:5px;border-radius:14px;flex-wrap:wrap;justify-content:flex-end}
.btn{appearance:none;border:0;background:transparent;color:var(--ink);font:500 13px 'Noto Sans SC',sans-serif;padding:7px 10px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;transition:background .2s}
.btn:hover{background:rgba(255,255,255,.14)}
.btn.on{background:rgba(127,243,226,.28);box-shadow:inset 0 0 0 1px rgba(127,243,226,.6)}
.btn .ic{font-size:15px;line-height:1}
.btn kbd{font:11px 'Noto Sans SC',sans-serif;opacity:.55;border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:0 3px}
#scenes{display:flex;gap:6px;padding:6px;border-radius:14px}
.scn{width:74px;border:0;background:transparent;color:var(--ink);cursor:pointer;border-radius:10px;padding:3px;font:12px 'Noto Sans SC',sans-serif;transition:background .2s,box-shadow .2s}
.scn img{display:block;width:100%;height:42px;object-fit:cover;border-radius:7px;background:#1a5070}
.scn span{display:block;margin-top:3px;text-align:center;opacity:.85}
.scn.on{background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1.5px var(--acc)}
#cards{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:10px;padding:10px;border-radius:20px;z-index:6;max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}
#cards::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:96px;padding:6px 6px 8px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);cursor:grab;text-align:center;transition:transform .2s,background .2s;touch-action:none}
.card:hover{transform:translateY(-4px);background:rgba(255,255,255,.18)}
.card:active{cursor:grabbing}
.card canvas{display:block;width:84px;height:84px;border-radius:10px;background:radial-gradient(circle at 50% 40%,rgba(120,220,230,.35),rgba(10,60,110,.45))}
.card b{display:block;margin-top:5px;font-weight:500;font-size:13px}
.card i{display:block;font-style:italic;font-size:10px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vortex{position:fixed;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:2px dashed rgba(255,255,255,.75);display:none;cursor:move;z-index:4;touch-action:none;animation:spin 3s linear infinite;box-shadow:0 0 18px rgba(127,243,226,.4)}
#vortex::after{content:'';position:absolute;inset:22px;border-radius:50%;background:rgba(255,255,255,.8)}
#vortex.on{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,10px);padding:9px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}
#showui{position:fixed;right:14px;bottom:14px;z-index:7;display:none;border-radius:12px}
body.hide-ui #showui{display:flex}
#ghost{position:fixed;pointer-events:none;z-index:8;display:none}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:16px;padding:30px;text-align:center;background:#04203a;z-index:20}
@media (max-width:640px){
  #title h1{font-size:22px}#title h1 small{display:block;font-size:12px;margin:2px 0 0}
  #counter{font-size:12px}
  #bar{left:10px;right:10px;top:auto;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 124px);align-items:stretch}
  #ctrls{justify-content:center;gap:1px;padding:4px}
  .btn{padding:6px 5px;font-size:12px;gap:3px}.btn kbd{display:none}.btn .ic{font-size:13px}
  #scenes{justify-content:center}.scn{width:23%}.scn img{height:34px}
  #cards{bottom:max(8px,env(safe-area-inset-bottom));gap:7px;padding:7px;left:8px;right:8px;transform:none;max-width:none}
  body.hide-ui #cards{transform:translateY(30px)}
  .card{width:76px}.card canvas{width:64px;height:64px}.card b{font-size:12px}
}
@media (max-width:640px) and (max-height:700px){#bar{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 112px)}#scenes .scn span{display:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="title" class="ui"><h1>浅海<small>· Ocean Shallows</small></h1><div id="counter">海面空空如也</div></div>
<div id="bar" class="ui">
  <div id="ctrls" class="glass">
    <button class="btn" id="b-rain" title="下雨 (R)"><span class="ic">🌧</span>下雨<kbd>R</kbd></button>
    <button class="btn" id="b-vortex" title="漩涡 (W)"><span class="ic">🌀</span>漩涡<kbd>W</kbd></button>
    <button class="btn" id="b-calm" title="平静 (C)"><span class="ic">〰</span>平静<kbd>C</kbd></button>
    <button class="btn" id="b-clear" title="清空海面"><span class="ic">✕</span>清空</button>
    <button class="btn" id="b-sound" title="声音 (M)"><span class="ic">🔇</span>声音<kbd>M</kbd></button>
    <button class="btn" id="b-hide" title="隐藏界面 (H)"><span class="ic">👁</span>隐藏<kbd>H</kbd></button>
  </div>
  <div id="scenes" class="glass">
    <button class="scn on" data-i="0"><img alt=""><span>热带浅滩</span></button>
    <button class="scn" data-i="1"><img alt=""><span>珊瑚潟湖</span></button>
    <button class="scn" data-i="2"><img alt=""><span>黄昏海湾</span></button>
    <button class="scn" data-i="3"><img alt=""><span>月夜荧光</span></button>
  </div>
</div>
<div id="cards" class="ui glass">
  <div class="card" data-t="manta"><canvas width="128" height="128"></canvas><b>蝠鲼</b><i>Mobula birostris</i></div>
  <div class="card" data-t="eagle"><canvas width="128" height="128"></canvas><b>斑点鹞鲼</b><i>Aetobatus narinari</i></div>
  <div class="card" data-t="stingray"><canvas width="128" height="128"></canvas><b>蓝点魟</b><i>Taeniura lymma</i></div>
  <div class="card" data-t="moon"><canvas width="128" height="128"></canvas><b>海月水母</b><i>Aurelia aurita</i></div>
  <div class="card" data-t="nettle"><canvas width="128" height="128"></canvas><b>金黄水母</b><i>Chrysaora fuscescens</i></div>
  <div class="card" data-t="shark"><canvas width="128" height="128"></canvas><b>黑鳍礁鲨</b><i>Carcharhinus melanopterus</i></div>
</div>
<div id="vortex"></div>
<button id="showui" class="btn glass"><span class="ic">👁</span>显示界面</button>
<div id="toast" class="glass"></div>
<div id="err">你的浏览器不支持 WebGL，无法显示这片海。</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// ===== 02-core.js =====
const O = window.O = {};
O.H = 10; O.W = 10; O.S = 10; O.time = 0; O.dt = 0.016; O.quality = 1;
O.params = {};
(function () {
  const ev = {};
  O.on = (n, f) => (ev[n] = ev[n] || []).push(f);
  O.emit = (n, ...a) => (ev[n] || []).forEach(f => f(...a));
  const frames = [];
  O.onFrame = (fn, order = 50) => { frames.push({ fn, order }); frames.sort((a, b) => a.order - b.order); };
  O._runFrame = (dt, t) => { for (const f of frames) f.fn(dt, t); };
})();

// ---- 渲染器 ----
const canvas = document.getElementById('gl');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'high-performance' });
} catch (e) { document.getElementById('err').style.display = 'flex'; throw e; }
renderer.autoClear = false;
O.renderer = renderer;
const gl = renderer.getContext();
O.isGL2 = renderer.capabilities.isWebGL2;
O.floatType = (() => {
  const ext = n => !!gl.getExtension(n);
  if (O.isGL2 && ext('EXT_color_buffer_float')) return THREE.HalfFloatType;
  if (!O.isGL2 && ext('OES_texture_half_float') && ext('EXT_color_buffer_half_float')) return THREE.HalfFloatType;
  if (ext('OES_texture_float') && (O.isGL2 || ext('WEBGL_color_buffer_float'))) return THREE.FloatType;
  return THREE.UnsignedByteType;
})();
O.floatLinear = O.floatType === THREE.HalfFloatType ? (O.isGL2 || !!gl.getExtension('OES_texture_half_float_linear')) : !!gl.getExtension('OES_texture_float_linear');

O.makeRT = (w, h, o = {}) => {
  const filt = o.linear !== false && (!o.float || O.floatLinear) ? THREE.LinearFilter : THREE.NearestFilter;
  return new THREE.WebGLRenderTarget(Math.max(1, w | 0), Math.max(1, h | 0), {
    type: o.float ? O.floatType : THREE.UnsignedByteType, format: THREE.RGBAFormat,
    minFilter: filt, magFilter: filt, depthBuffer: !!o.depth, stencilBuffer: false,
    wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping
  });
};
const fsCam = new THREE.Camera();
const fsMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
fsMesh.frustumCulled = false;
const fsScene = new THREE.Scene(); fsScene.add(fsMesh);
O.fsPass = (mat, rt, clear = true) => {
  fsMesh.material = mat;
  renderer.setRenderTarget(rt || null);
  if (clear) renderer.clear();
  renderer.render(fsScene, fsCam);
};
O.FS_VERT = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }';

// ---- 共享 uniform（所有材质引用同一对象） ----
O.U = {
  uTime: { value: 0 }, uW: { value: 10 }, uH: { value: 10 }, uS: { value: 10 },
  uReef: { value: Array.from({ length: 24 }, () => new THREE.Vector4(0, 0, 0.01, 0)) },
  uLagoon: { value: 0 }, uSunDir: { value: new THREE.Vector3(0.25, -0.35, 1).normalize() }
};

// ---- 噪声 + 岸线 + 水深（GLSL 与 JS 同一公式） ----
O.glsl = {};
O.glsl.common = `
uniform float uTime, uW, uH, uS, uLagoon; uniform vec4 uReef[24]; uniform vec3 uSunDir;
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(.1031,.1030,.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(hash12(i), hash12(i+vec2(1,0)), f.x), mix(hash12(i+vec2(0,1)), hash12(i+vec2(1,1)), f.x), f.y); }
float fbm(vec2 p){ float s = 0., a = .5; for(int i=0;i<4;i++){ s += a*vnoise(p); p = mat2(1.6,1.2,-1.2,1.6)*p + 3.1; a *= .5; } return s; }
vec2 voronoi(vec2 p){ vec2 n = floor(p), f = fract(p); float d1 = 8., d2 = 8.;
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){ vec2 g = vec2(i,j); vec2 o = hash22(n+g);
    float d = length(g + o - f); if(d < d1){ d2 = d1; d1 = d; } else if(d < d2) d2 = d; }
  return vec2(d1, d2); }
float shoreDist(vec2 p){ vec2 q = p - vec2(-uW*.5, uH*.5); float th = atan(-q.y, q.x);
  float R = uS*(.34 + .05*sin(3.*th + .7) + .03*sin(7.*th)); return length(q) - R; }
float reefBumps(vec2 p){ float h = 0.; for(int i=0;i<24;i++){ vec4 r = uReef[i]; float d = length(p - r.xy);
  h = max(h, r.w * smoothstep(r.z, r.z*.3, d)); } return h; }
float depthAt(vec2 p){ float sd = shoreDist(p); if(sd < 0.) return sd*.6;
  float s = sd; float d = .08 + 3.6*(1. - exp(-s/(.22*uS))) + .35*fbm(p*.35) - .175;
  float rq = (s - .55*uS)/(.06*uS); float ring = exp(-rq*rq);
  d = mix(d, d*.6, uLagoon); d = mix(d, min(d, .55), uLagoon*ring);
  return max(d - reefBumps(p), .05); }
`;
const fract = x => x - Math.floor(x);
O.hash12 = (x, y) => { let a = fract(x * .1031), b = fract(y * .1031), c = fract(x * .1031);
  const d = a * (b + 33.33) + b * (c + 33.33) + c * (a + 33.33); a += d; b += d; c += d; return fract((a + b) * c); };
O.vnoise = (x, y) => { const ix = Math.floor(x), iy = Math.floor(y); let fx = x - ix, fy = y - iy;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); const h = O.hash12;
  const a = h(ix, iy), b = h(ix + 1, iy), c = h(ix, iy + 1), d = h(ix + 1, iy + 1);
  return (a + (b - a) * fx) + ((c + (d - c) * fx) - (a + (b - a) * fx)) * fy; };
O.fbm = (x, y) => { let s = 0, a = .5; for (let i = 0; i < 4; i++) { s += a * O.vnoise(x, y);
  const nx = 1.6 * x - 1.2 * y + 3.1, ny = 1.2 * x + 1.6 * y + 3.1; x = nx; y = ny; a *= .5; } return s; };
O.shoreDist = (x, y) => { const qx = x + O.W * .5, qy = y - O.H * .5, th = Math.atan2(-qy, qx);
  return Math.hypot(qx, qy) - O.S * (.34 + .05 * Math.sin(3 * th + .7) + .03 * Math.sin(7 * th)); };
O.reefBumps = (x, y) => { let h = 0; for (const r of O.U.uReef.value) { const d = Math.hypot(x - r.x, y - r.y);
  const t = Math.min(1, Math.max(0, (d - r.z) / (r.z * .3 - r.z))); h = Math.max(h, r.w * t * t * (3 - 2 * t)); } return h; };
O.depth = (x, y) => { const sd = O.shoreDist(x, y); if (sd < 0) return sd * .6; const S = O.S, L = O.U.uLagoon.value;
  let d = .08 + 3.6 * (1 - Math.exp(-sd / (.22 * S))) + .35 * O.fbm(x * .35, y * .35) - .175;
  const ring = Math.exp(-Math.pow((sd - .55 * S) / (.06 * S), 2));
  d = d + (d * .6 - d) * L; d = d + (Math.min(d, .55) - d) * L * ring;
  return Math.max(d - O.reefBumps(x, y), .05); };
O.depthGrad = (x, y) => { const e = .08; return [(O.depth(x + e, y) - O.depth(x - e, y)) / (2 * e), (O.depth(x, y + e) - O.depth(x, y - e)) / (2 * e)]; };
O.isWater = (x, y, min = .3) => O.depth(x, y) > min;

// ---- 随机数（可复现） ----
O.rng = seed => () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
O.rand = (a = 0, b = 1) => a + Math.random() * (b - a);
O.randomWater = (min = .8, tries = 80) => {
  for (let i = 0; i < tries; i++) { const x = O.rand(-O.W * .45, O.W * .45), y = O.rand(-O.H * .42, O.H * .42); if (O.depth(x, y) > min) return [x, y]; }
  return [O.W * .25, -O.H * .2];
};
function genReefs() {
  const r = O.rng(7), arr = O.U.uReef.value; let k = 0;
  const maxN = Math.max(8, Math.min(arr.length, Math.round(arr.length * O.W * O.H / 144)));
  for (let i = 0; i < 400 && k < maxN; i++) {
    const x = (r() - .5) * O.W * .96, y = (r() - .5) * O.H * .96, sd = O.shoreDist(x, y);
    if (sd < .12 * O.S || sd > .9 * O.S) continue;
    if (arr.slice(0, k).some(v => Math.hypot(v.x - x, v.y - y) < v.z + .5)) continue;
    const rad = .22 + r() * .38; arr[k++].set(x, y, rad, (.6 + r() * .8) * Math.min(1, sd / (.35 * O.S)));
  }
  for (; k < arr.length; k++) arr[k].set(1e4, 1e4, .01, 0);
}

// ---- 尺寸 ----
O.camMain = new THREE.OrthographicCamera(-5, 5, 5, -5, -50, 50);
O.camMain.position.set(0, 0, 10); O.camMain.lookAt(0, 0, 0);
O.qScale = 1;
O.resize = () => {
  const w = innerWidth, h = innerHeight;
  O.W = O.H * w / h; O.S = Math.min(O.W, O.H);
  O.U.uW.value = O.W; O.U.uH.value = O.H; O.U.uS.value = O.S;
  genReefs();
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2) * O.qScale);
  renderer.setSize(w, h, false);
  const c = O.camMain; c.left = -O.W / 2; c.right = O.W / 2; c.top = O.H / 2; c.bottom = -O.H / 2; c.updateProjectionMatrix();
  O.emit('resize', w, h);
};
let rsT = 0; addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(O.resize, 120); });

// ---- 指针 ----
O.toWorld = (cx, cy) => [(cx / innerWidth - .5) * O.W, (.5 - cy / innerHeight) * O.H];
O.toScreen = (x, y) => [(x / O.W + .5) * innerWidth, (.5 - y / O.H) * innerHeight];
O.pointer = { x: 0, y: 0, down: false, vx: 0, vy: 0, id: null };
const handlers = []; // {prio, down(p)->bool, move(p), up(p)}
O.addInput = h => { handlers.push(h); handlers.sort((a, b) => b.prio - a.prio); };
let active = null, lastMove = 0;
canvas.addEventListener('pointerdown', e => {
  const [x, y] = O.toWorld(e.clientX, e.clientY); Object.assign(O.pointer, { x, y, down: true, id: e.pointerId, vx: 0, vy: 0 });
  O.emit('userGesture');
  active = handlers.find(h => h.down && h.down(O.pointer)) || null;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener('pointermove', e => {
  const [x, y] = O.toWorld(e.clientX, e.clientY), now = performance.now(), dt = Math.max(1, now - lastMove) / 1000;
  const p = O.pointer; p.vx = (x - p.x) / dt; p.vy = (y - p.y) / dt; p.x = x; p.y = y; lastMove = now;
  if (active && active.move) active.move(p); else O.emit('hover', p);
});
const endPtr = () => { O.pointer.down = false; if (active && active.up) active.up(O.pointer); active = null; };
canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);

// ---- 自适应质量 ----
(function () {
  let acc = 0, n = 0, ema = 60, good = 0, cool = 0; const levels = [.6, .8, 1];
  O.onFrame(dt => {
    acc += dt; n++; cool -= dt; if (acc < .5) return;
    ema = ema * .6 + (n / acc) * .4; acc = 0; n = 0;
    if (document.hidden || cool > 0) return;
    let i = levels.indexOf(O.quality);
    if (ema < 45 && i > 0) { i--; good = 0; }
    else if (ema > 58) { good += .5; if (good >= 3 && i < 2) { i++; good = 0; } else return; }
    else { good = 0; return; }
    O.quality = levels[i]; O.qScale = O.quality === 1 ? 1 : O.quality === .8 ? .85 : .7; cool = 2;
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2) * O.qScale); renderer.setSize(innerWidth, innerHeight, false);
    O.emit('quality', O.quality);
  }, 0);
})();

// ---- 提示 ----

    const o = {};

    NUM_KEYS.forEach(k => o[k] = p[k]);

  O.calmFactor = 1;          // 平静模式下长浪衰减

  const DUR = 2.5;

  O.setScene = i => {
    if (i < 0 || i >= prepared.length) return;
    if (i === O.sceneIndex && t >= 1) return;

    uAmbient: { value: 1 }, uSky: { value: O.params.sky }, uSwellAmp: { value: 1 }, uSwellPhase: { value: 0 },
    uGlint: { value: 1 }, uGlintCol: { value: O.params.glintCol }, uBioOn: { value: 0 }, uSand: { value: O.params.sand },

    layers.forEach((L, j) => { L.m.uniforms.uPx.value = pxPerUnit; L.g.setDrawRange(0, cnt[j]);
      ['position', 'aCol', 'aSize'].forEach(a => L.g.attributes[a].needsUpdate = true); });
  }, 50);
  return api;
})();
// ===== 13-audio.js =====
O.audio = (function () {
  let ctx = null, master, comp, waveGain, waveLP, hissGain, rainGain, vortexGain, vortexBP, noiseBuf, pinkBuf, delay;
  let muted = true;
  const api = { get muted() { return muted; } };

  function makeNoise(pink) {
    const len = ctx.sampleRate * 3, b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      if (!pink) { d[i] = w; continue; }
      b0 = .99886 * b0 + w * .0555179; b1 = .99332 * b1 + w * .0750759; b2 = .969 * b2 + w * .153852;
      b3 = .8665 * b3 + w * .3104856; b4 = .55 * b4 + w * .5329522; b5 = -.7616 * b5 - w * .016898;
      d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + w * .5362) * .11;
    }
    return b;
  }
  const loop = (buf, dest) => { const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.connect(dest); s.start(0, Math.random() * 2); return s; };

  function init() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC();
    comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 4; comp.connect(ctx.destination);
    master = ctx.createGain(); master.gain.value = 0; master.connect(comp);
    delay = ctx.createDelay(); delay.delayTime.value = .18; const fb = ctx.createGain(); fb.gain.value = .25; const wet = ctx.createGain(); wet.gain.value = .3;
    delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(master);
    noiseBuf = makeNoise(false); pinkBuf = makeNoise(true);
    // 海浪：粉噪声 → 低通 → 增益（随冲刷包络）
    waveLP = ctx.createBiquadFilter(); waveLP.type = 'lowpass'; waveLP.frequency.value = 600; waveLP.Q.value = .4;
    waveGain = ctx.createGain(); waveGain.gain.value = 0; waveLP.connect(waveGain); waveGain.connect(master);
    loop(pinkBuf, waveLP);
    // 回流嘶嘶声
    const hp = ctx.createBiquadFilter(); hp.type = 'bandpass'; hp.frequency.value = 3000; hp.Q.value = .7;
    hissGain = ctx.createGain(); hissGain.gain.value = 0; hp.connect(hissGain); hissGain.connect(master); loop(noiseBuf, hp);
    // 雨
    const rh = ctx.createBiquadFilter(); rh.type = 'highpass'; rh.frequency.value = 2500;
    rainGain = ctx.createGain(); rainGain.gain.value = 0; rh.connect(rainGain); rainGain.connect(master); loop(noiseBuf, rh);
    // 漩涡
    vortexBP = ctx.createBiquadFilter(); vortexBP.type = 'bandpass'; vortexBP.frequency.value = 200; vortexBP.Q.value = 2;
    vortexGain = ctx.createGain(); vortexGain.gain.value = 0; vortexBP.connect(vortexGain); vortexGain.connect(master); loop(pinkBuf, vortexBP);
  }

  api.setMuted = m => {
    muted = m;
    if (!m) { init(); if (ctx && ctx.state === 'suspended') ctx.resume(); }
    if (master) master.gain.setTargetAtTime(m ? 0 : .9, ctx.currentTime, .1);
    O.emit('toggles');
  };
  api.toggle = () => api.setMuted(!muted);
  O.on('userGesture', () => { if (ctx && ctx.state === 'suspended' && !muted) ctx.resume(); });

  api.splash = (size = 1) => {
    if (!ctx || muted) return;
    const t = ctx.currentTime, s = Math.min(2, size);
    const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.playbackRate.value = .8 + Math.random() * .4;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2400 - s * 700 + Math.random() * 300; bp.Q.value = .9;
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.35 * Math.min(1.2, .3 + s), t + .005);
    g.gain.exponentialRampToValueAtTime(.001, t + .25 + s * .25);
    src.connect(bp); bp.connect(g); g.connect(master); src.start(t, Math.random() * 2); src.stop(t + .8);
    if (s > .4) {
      const o = ctx.createOscillator(), og = ctx.createGain(); o.type = 'sine';
      o.frequency.setValueAtTime(190 - s * 30, t); o.frequency.exponentialRampToValueAtTime(55, t + .16);
      og.gain.setValueAtTime(.3 * Math.min(1, s), t); og.gain.exponentialRampToValueAtTime(.001, t + .18);
      o.connect(og); og.connect(master); o.start(t); o.stop(t + .2);
    }
  };

  const NOTES = { spawn: [1318.5, 1975.5], deny: [987.8, 740], ui: [1568], scene: [1046.5, 1318.5, 1568], clear: [1568, 1174.7, 880] };
  api.chime = (kind = 'ui') => {
    if (!ctx || muted) return;
    const t0 = ctx.currentTime;
    (NOTES[kind] || NOTES.ui).forEach((f, i) => {
      const t = t0 + i * .08;
      [['sine', 1, .16], ['triangle', 2, .04]].forEach(([type, mul, vol]) => {
        const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.value = f * mul;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .004); g.gain.exponentialRampToValueAtTime(.0005, t + .45);
        o.connect(g); g.connect(master); g.connect(delay); o.start(t); o.stop(t + .5);
      });
    });
  };

  let sparkT = 0;
  O.onFrame(dt => {
    if (!ctx || muted) return;
    const t = ctx.currentTime, sw = O.swash(), P = O.params;
    const receding = Math.cos(O.swellPhase) < 0;
    const night = P.bio, dusk = O.sceneIndex === 2 ? 1 : 0;
    const amp = Math.min(1, P.swellAmp * O.calmFactor + .1);
    waveGain.gain.setTargetAtTime((.12 + .55 * Math.pow(sw, 1.5)) * amp * (1 - .3 * night), t, .08);
    waveLP.frequency.setTargetAtTime((400 + 1000 * sw) * (1 - .35 * dusk), t, .1);
    hissGain.gain.setTargetAtTime(receding ? .05 * sw * amp : 0, t, .15);
    rainGain.gain.setTargetAtTime(.12 * O.rain.k, t, .2);
    vortexGain.gain.setTargetAtTime(.25 * O.vortex.s, t, .2);
    vortexBP.frequency.setTargetAtTime(170 + 60 * Math.sin(O.time * 1.3), t, .2);
    // 月夜：随机轻微的高频「叮」
    if (night > .5 && (sparkT -= dt) < 0) {
      sparkT = 1.5 + Math.random() * 4;
      const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 2600 + Math.random() * 1600;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.012, t + .01); g.gain.exponentialRampToValueAtTime(.0002, t + .6);
      o.connect(g); g.connect(delay); o.start(t); o.stop(t + .7);
    }
  }, 95);
  return api;
})();
// ===== 14-ui-main.js =====
(function () {
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];

  // ---- 卡片缩略图：独立的小 renderer 实时渲染真实 3D 模型 ----
  const thumbR = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  thumbR.setSize(128, 128, false); thumbR.setPixelRatio(1); thumbR.setClearColor(0x000000, 0);
  const cam = new THREE.PerspectiveCamera(32, 1, .1, 50); cam.up.set(0, 0, 1);
  const thumbs = {};
  const fakeC = { x: 0, y: 0, size: 1 };
  function mkThumb(type) {
    const scene = new THREE.Scene(); let obj, anim, jelly = null, scale = 1, dist = 3.2;
    if (type === 'manta' || type === 'eagle' || type === 'stingray') {
      const g = O.rayGeometry(type); anim = new THREE.InstancedBufferAttribute(new Float32Array(3), 3); g.setAttribute('aAnim', anim);
      obj = new THREE.InstancedMesh(g, O.rayMaterialFor(type), 1); scale = { manta: 1.5, eagle: 1.05, stingray: 1.45 }[type];
      if (type === 'eagle') obj.position.x = .55;
    } else if (type === 'shark') {
      const g = O.sharkGeometry().clone(); anim = new THREE.InstancedBufferAttribute(new Float32Array(2), 2); g.setAttribute('aAnim', anim);
      obj = new THREE.InstancedMesh(g, O.sharkMaterial(), 1); scale = 1.9; obj.position.x = .15;
    } else {
      jelly = O.jellyVisual(type); jelly.mats.forEach(m => m.uniforms.uGammaOut.value = 1);
      obj = jelly.group; scene.add(jelly.rmesh); scale = type === 'moon' ? 1.6 : 1.05; dist = type === 'moon' ? 3.0 : 3.6;
    }
    const holder = new THREE.Group(); holder.add(obj); scene.add(holder);
    if (obj.isInstancedMesh) { obj.setMatrixAt(0, new THREE.Matrix4()); obj.frustumCulled = false; }
    obj.scale.setScalar(scale);
    return { scene, obj, anim, jelly, holder, dist, type, ph: Math.random() * 6, cv: null };
  }
  $$('.card').forEach(card => {
    const t = card.dataset.t; thumbs[t] = mkThumb(t); thumbs[t].cv = card.querySelector('canvas').getContext('2d');
  });
  const order = Object.keys(thumbs); let rr = 0, frameN = 0;
  function renderThumb(T, dt) {
    T.ph += dt * (T.type === 'shark' ? 6 : 2.4);
    T.holder.rotation.z = O.time * .35 + T.ph * 0;
    if (T.anim && T.anim.itemSize === 3) { T.anim.setXYZ(0, T.ph, T.type === 'stingray' ? .5 : .35, T.type === 'stingray' ? 1 : 0); T.anim.needsUpdate = true; }
    else if (T.anim) { T.anim.setXY(0, T.ph, 1.2); T.anim.needsUpdate = true; }
    if (T.jelly) {
      const p = (O.time / 1.8) % 1, con = p < .3 ? Math.sin(p / .3 * Math.PI / 2) : 1 - (p - .3) / .7;
      const r = 1 - .2 * con; T.jelly.bell.scale.set(r, r, 1 + .15 * con);
      T.obj.position.z = .55 + .04 * con; T.obj.rotation.set(.25, 0, 0);
      T.jelly.mats.forEach(m => { m.uniforms.uGlow.value = O.params.bio * .4; m.uniforms.uFade.value = 1; });
      fakeC.size = T.obj.scale.x; O.jellySim(T.jelly, fakeC, Math.min(dt * 2, .05), true);
    }
    const isJ = !!T.jelly;
    cam.position.set(0, -T.dist * .78, T.dist * (isJ ? .25 : .62)); cam.lookAt(0, 0, isJ ? -.1 : 0);
    thumbR.clear(); thumbR.render(T.scene, cam);
    T.cv.clearRect(0, 0, 128, 128); T.cv.drawImage(thumbR.domElement, 0, 0);
  }
  O.onFrame(dt => {
    frameN++;
    const n = O.quality < .7 ? (frameN % 2 ? 0 : 1) : 2;
    for (let i = 0; i < n; i++) { renderThumb(thumbs[order[rr % order.length]], dt * order.length / Math.max(1, n)); rr++; }
  }, 99);

  // ---- 卡片：点击抛入 / 拖动放置 ----
  $$('.card').forEach(card => {
    const type = card.dataset.t; let st = null;
    card.addEventListener('pointerdown', e => {
      e.preventDefault(); O.emit('userGesture'); try { card.setPointerCapture(e.pointerId); } catch (_) {}
      st = { x: e.clientX, y: e.clientY, drag: null };
    });
    card.addEventListener('pointermove', e => {
      if (!st) return;
      const [wx, wy] = O.toWorld(e.clientX, e.clientY);
      if (!st.drag && Math.hypot(e.clientX - st.x, e.clientY - st.y) > 8) {
        st.drag = O.holdCreature(type, wx, wy) || 'full';
        O.heldTarget = { x: wx, y: wy };
      }
      if (st.drag && O.heldTarget) { O.heldTarget.x = wx; O.heldTarget.y = wy; }
    });
    const end = e => {
      if (!st) return;
      if (st.drag) { if (st.drag !== 'full') O.releaseCreature(st.drag); O.heldTarget = null; }
      else if (e.type === 'pointerup') { const r = card.getBoundingClientRect(); O.throwCreature(type, r.left + r.width / 2, r.top + r.height * .35); }
      st = null;
    };
    card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
  });

  // ---- 控制栏 ----
  const hide = v => { document.body.classList.toggle('hide-ui', v ?? !document.body.classList.contains('hide-ui')); };
  $('#b-rain').onclick = () => { O.toggleRain(); O.audio.chime('ui'); };
  $('#b-vortex').onclick = () => { O.toggleVortex(); O.audio.chime('ui'); };
  $('#b-calm').onclick = () => { O.toggleCalm(); O.audio.chime('ui'); };
  $('#b-clear').onclick = () => { O.clearAll(); O.audio.chime('clear'); };
  $('#b-sound').onclick = () => { O.audio.toggle(); O.audio.chime('ui'); };
  $('#b-hide').onclick = () => hide(true);
  $('#showui').onclick = () => hide(false);
  $$('.scn').forEach(b => b.onclick = () => { O.setScene(+b.dataset.i); });
  O.on('scene', i => { $$('.scn').forEach(b => b.classList.toggle('on', +b.dataset.i === i)); O.audio.chime('scene'); O.toast(O.SCENES[i].name, 1200); });
  O.on('toggles', () => {
    $('#b-rain').classList.toggle('on', O.rain.on); $('#b-vortex').classList.toggle('on', O.vortex.on); $('#b-calm').classList.toggle('on', O.calm);
    $('#b-sound').classList.toggle('on', !O.audio.muted); $('#b-sound .ic').textContent = O.audio.muted ? '🔇' : '🔊';
    $('#vortex').classList.toggle('on', O.vortex.on);
  });
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase(); O.emit('userGesture');
    if (k === 'r') O.toggleRain(); else if (k === 'w') O.toggleVortex(); else if (k === 'c') O.toggleCalm();
    else if (k === 'm') O.audio.toggle(); else if (k === 'h') hide();
    else if (k >= '1' && k <= '4') O.setScene(+k - 1);
  });

  // ---- 漩涡手柄 ----
  const vh = $('#vortex'); let vDrag = false;
  vh.addEventListener('pointerdown', e => { vDrag = true; try { vh.setPointerCapture(e.pointerId); } catch (_) {} e.preventDefault(); });
  vh.addEventListener('pointermove', e => { if (!vDrag) return; const [x, y] = O.toWorld(e.clientX, e.clientY); O.vortex.x = x; O.vortex.y = y; });
  vh.addEventListener('pointerup', () => vDrag = false); vh.addEventListener('pointercancel', () => vDrag = false);
  O.onFrame(() => { if (!O.vortex.on) return; const [sx, sy] = O.toScreen(O.vortex.x, O.vortex.y); vh.style.left = sx + 'px'; vh.style.top = sy + 'px'; }, 98);

  // ---- 启动 ----
  try {
    O.resize();
    $$('.scn img').forEach(img => img.src = O.seabed.thumb(+img.parentNode.dataset.i));
    const put = (type, min, n, opts = {}) => { for (let i = 0; i < n; i++) { const [x, y] = O.randomWater(min); O.spawn(type, x, y, opts); } };
    put('manta', 1.4, 2); put('eagle', 1.2, 1); put('stingray', .8, 1);
    put('moon', 1.0, 3); put('nettle', 1.0, 2);
    const [sx, sy] = O.randomWater(.8);
    const s1 = O.spawn('shark', sx, sy); const s2 = O.spawn('shark', sx + .8, sy - .6);
    if (s1 && s2) { s2.heading = s1.heading; s2.leader = s1; }
    O.emit('toggles');
  } catch (err) { console.error(err); const el = $('#err'); el.textContent = '初始化失败：' + err.message; el.style.display = 'flex'; throw err; }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, Math.max(.001, (now - last) / 1000)); last = now;
    O.dt = dt; O.time += dt;
    O._runFrame(dt, O.time);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
