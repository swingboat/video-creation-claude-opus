<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>新年夜的火柴 · 童话补完计划</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#05070f;color:#f4ead8;
  font-family:"Noto Serif SC","Songti SC","STSong",serif;-webkit-user-select:none;user-select:none;touch-action:none}
#app{position:fixed;inset:0}
#app canvas{display:block;width:100%;height:100%;cursor:pointer}
.hide{opacity:0!important;pointer-events:none!important}
/* 开场 */
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(ellipse at 50% 60%,rgba(40,30,30,.55),rgba(3,5,12,.94) 70%);transition:opacity 1.6s;z-index:20;text-align:center;padding:24px}
#intro .series{font-size:13px;letter-spacing:.5em;color:#c9a46a;opacity:.85}
#intro h1{font-size:clamp(40px,8vw,76px);font-weight:900;letter-spacing:.12em;color:#fff3df;
  text-shadow:0 0 30px rgba(255,170,90,.45),0 0 2px #fff}
#intro p.sub{font-size:clamp(14px,2.2vw,18px);color:#d9cbb3;letter-spacing:.15em}
#intro .note{font-size:12px;color:#8f8a8f;letter-spacing:.2em;margin-top:6px}
.btn{font-family:inherit;border:0;cursor:pointer;border-radius:999px;padding:14px 38px;font-size:17px;letter-spacing:.25em;
  color:#3a1d08;background:linear-gradient(180deg,#ffd9a1,#f3a85c);box-shadow:0 0 28px rgba(255,160,80,.55),inset 0 1px 0 #fff6e2;
  transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-1px) scale(1.03);box-shadow:0 0 42px rgba(255,170,90,.8),inset 0 1px 0 #fff6e2}
.btn:disabled{cursor:wait;opacity:.55;transform:none;box-shadow:0 0 14px rgba(255,160,80,.25)}
#intro .btn{margin-top:22px}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;transition:opacity 1s}
#matches{position:absolute;left:22px;top:18px;display:flex;gap:7px}
#matches i{display:block;width:7px;height:38px;border-radius:2px;background:linear-gradient(180deg,#c3362b 0 22%,#e8cf9c 22%);
  box-shadow:0 0 8px rgba(255,150,80,.35);transition:opacity .6s,filter .6s}
#matches i.used{opacity:.22;filter:grayscale(1)}
#clock{position:absolute;left:50%;top:22px;transform:translateX(-50%);font-size:15px;letter-spacing:.3em;color:#efe3cd;
  text-shadow:0 0 10px rgba(0,0,0,.8)}
#mute{position:absolute;right:20px;top:16px;width:36px;height:36px;border-radius:50%;border:0;pointer-events:auto;cursor:pointer;
  background:rgba(255,255,255,.13);color:#f4ead8;font-size:16px;backdrop-filter:blur(4px)}
#mute.off{opacity:.45;text-decoration:line-through}
#hint{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);width:min(92vw,720px);text-align:center;
  font-size:14px;letter-spacing:.14em;color:#efe6d6;text-shadow:0 0 8px #000,0 0 16px rgba(0,0,0,.8);transition:opacity .8s}
#caption{position:absolute;left:50%;bottom:calc(var(--bar) + 10px);transform:translateX(-50%);text-align:center;width:min(94vw,820px);
  padding:34px 40px 8px;background:radial-gradient(ellipse 50% 100% at 50% 100%,rgba(3,4,10,.6),rgba(3,4,10,.25) 55%,rgba(3,4,10,0) 100%);transition:opacity .9s}
#caption .t{font-size:13px;letter-spacing:.6em;color:#e9b56a;margin-bottom:8px}
#caption .l{font-size:clamp(16px,2.4vw,22px);line-height:1.85;letter-spacing:.1em;color:#fff6e8;
  text-shadow:0 0 12px rgba(0,0,0,.9),0 0 26px rgba(0,0,0,.6)}
#caption .ln{display:block;opacity:0;animation:capIn 1.3s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes capIn{from{opacity:0;transform:translateY(8px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
/* 电影黑边 */
:root{--bar:8.5vh}
.bar{position:fixed;left:0;right:0;height:var(--bar);background:#020308;z-index:9;pointer-events:none;
  transition:transform 1.3s cubic-bezier(.6,0,.2,1)}
.bar.top{top:0;transform:translateY(-100%)} .bar.bot{bottom:0;transform:translateY(100%)}
body.cine .bar{transform:none}
body.cine #hint,body.cine #action{opacity:0;pointer-events:none}
#clock{transition:top 1.3s cubic-bezier(.6,0,.2,1),opacity .6s}
body.cine #clock{top:calc(var(--bar) / 2 - 9px);opacity:.75}
#action{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);pointer-events:auto;transition:opacity .5s}
/* 结局 */
#ending{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;z-index:30;text-align:center;
  background:linear-gradient(180deg,rgba(255,242,224,.86) 0%,rgba(255,238,218,.62) 38%,rgba(255,236,214,.12) 62%,rgba(255,236,214,0) 78%);
  color:#4a2d1c;transition:opacity 2.5s;padding:9vh 24px 24px}
#ending h2{font-size:clamp(36px,6.4vw,60px);letter-spacing:.2em;font-weight:900;color:#7a3518;text-shadow:0 0 24px #fff}
#ending p{font-size:clamp(14px,2vw,17px);line-height:1.95;letter-spacing:.12em;max-width:620px;text-shadow:0 0 12px rgba(255,246,232,.9)}
#ending .btn{margin-top:14px}
#ending .credit{position:absolute;bottom:22px;font-size:12px;letter-spacing:.2em;color:#5a3a26;padding:4px 14px;border-radius:99px;background:rgba(255,246,232,.55)}
@media (max-width:640px){
  #matches{left:14px;top:14px;gap:5px} #matches i{width:6px;height:30px}
  #hint{font-size:12px;bottom:18px} #action{bottom:58px} .btn{padding:12px 28px;font-size:15px}
  :root{--bar:7vh} #caption{padding:26px 14px 6px}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="bar top"></div><div class="bar bot"></div>
<div id="hud" class="hide">
  <div id="matches" aria-label="剩余火柴"><i></i><i></i><i></i><i></i><i></i></div>
  <div id="clock">23:00</div>
  <button id="mute" title="声音 (M)">♪</button>
  <div id="caption" class="hide"><div class="t"></div><div class="l"></div></div>
  <button id="action" class="btn hide"></button>
  <div id="hint"></div>
</div>
<div id="intro">
  <div class="series">童话补完计划 · 第一夜</div>
  <h1>新年夜的火柴</h1>
  <p class="sub">这一回，火光里的一切都会留下来。</p>
  <button id="start" class="btn" disabled>正在铺雪……</button>
  <div class="note">建议打开声音 · 点击地面行走 · 拖动旋转视角 · 滚轮缩放</div>
</div>
<div id="ending" class="hide">
  <h2>新年快乐</h2>
  <p>天亮了。运河上的冰在晨光里闪闪发亮。<br>那个小女孩没有冻僵在墙角——<br>她和奶奶、还有一只白鹅，一起过了新年。</p>
  <button id="again" class="btn">再走一遍</button>
  <div class="credit">原著：安徒生《卖火柴的小女孩》（1845）· 童话补完计划 第一夜</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// ===== 02-core.js：命名空间、渲染器、工具、纹理、材质、碰撞、输入、光源池 =====
if (!window.THREE) {
  document.getElementById('start').textContent = '加载失败，请检查网络后刷新';
  throw new Error('three.js 加载失败');
}
const T = THREE;
const M = window.M = { T, time: 0, dt: 0, quality: 1 };

M.renderer = new T.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
M.renderer.toneMapping = T.NoToneMapping;
M.renderer.shadowMap.enabled = true;
M.renderer.shadowMap.type = T.PCFSoftShadowMap;
M.pixelScale = 1;
M.setPixelRatio = () => M.renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75) * M.pixelScale);
M.setPixelRatio();
M.renderer.setSize(innerWidth, innerHeight);
document.getElementById('app').appendChild(M.renderer.domElement);
M.scene = new T.Scene();
M.camera = new T.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 400);
M.scene.fog = new T.FogExp2(0x1b2440, 0.022);
M.scene.fog.color.convertSRGBToLinear();

// ---- 帧回调 ----
M._frames = [];
M.onFrame = (fn, order = 50) => { M._frames.push({ fn, order }); M._frames.sort((a, b) => a.order - b.order); };

// ---- 数学工具 ----
M.clamp = (x, a, b) => Math.max(a, Math.min(b, x));
M.lerp = (a, b, t) => a + (b - a) * t;
M.smooth = (a, b, x) => { const t = M.clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
M.damp = (cur, target, rate, dt) => M.lerp(cur, target, 1 - Math.exp(-rate * dt));
M.col = hex => new T.Color(hex).convertSRGBToLinear();
M.rand = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const _h2 = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
M.noise2 = (x, y) => {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = _h2(ix, iy), b = _h2(ix + 1, iy), c = _h2(ix, iy + 1), d = _h2(ix + 1, iy + 1);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
};
M.fbm2 = (x, y, o = 4) => { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * M.noise2(x * f, y * f); f *= 2; a *= 0.5; } return s; };
// 周期为 p 的值噪声，用于可平铺贴图
M.noiseP = (x, y, p) => {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy, w = v => ((v % p) + p) % p;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = _h2(w(ix), w(iy)), b = _h2(w(ix + 1), w(iy)), c = _h2(w(ix), w(iy + 1)), d = _h2(w(ix + 1), w(iy + 1));
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
};
M.glslNoise = `
float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y); }
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<5;i++){ s+=a*noise(p); p=p*2.03+17.1; a*=.5; } return s; }
`;

// ---- Canvas 纹理工厂 ----
M.tex = {};
const _texCache = {};
function canvasTex(name, size, draw, opts = {}) {
  if (_texCache[name]) return _texCache[name];
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); draw(g, size);
  const t = new T.CanvasTexture(c);
  if (opts.srgb !== false) t.encoding = T.sRGBEncoding;
  t.wrapS = t.wrapT = opts.clamp ? T.ClampToEdgeWrapping : T.RepeatWrapping;
  t.anisotropy = 4;
  return (_texCache[name] = t);
}
M.canvasTex = canvasTex;
M.tex.cobble = () => canvasTex('cobble', 1024, (g, s) => {
  const r = M.rand(7); g.fillStyle = '#1c1c22'; g.fillRect(0, 0, s, s);
  const rows = 16, rh = s / rows;
  for (let y = 0; y < rows; y++) {
    let x = (y % 2) * rh * 0.5 - rh;
    while (x < s) {
      const w = rh * (0.75 + r() * 0.55), l = 34 + r() * 18, warm = r() < 0.55, hue = warm ? 22 + r() * 18 : 215 + r() * 15;
      const x0 = x + 2.5 + r() * 1.5, y0 = y * rh + 2.5 + r() * 1.5, ww = w - 5 - r() * 2, hh = rh - 5 - r() * 2;
      const cx = x0 + ww * (0.42 + r() * 0.12), cy = y0 + hh * 0.4;
      const gr = g.createRadialGradient(cx, cy, 2, cx, cy, Math.max(ww, hh) * 0.72);
      gr.addColorStop(0, `hsl(${hue},${5 + r() * 6}%,${l + 9}%)`);
      gr.addColorStop(0.65, `hsl(${hue},${4 + r() * 6}%,${l}%)`);
      gr.addColorStop(1, `hsl(${hue},6%,${l - 14}%)`);
      g.fillStyle = gr; g.beginPath();
      g.roundRect ? g.roundRect(x0, y0, ww, hh, 9 + r() * 5) : g.rect(x0, y0, ww, hh); g.fill();
      g.fillStyle = 'rgba(255,250,240,0.07)'; g.beginPath(); g.ellipse(cx, cy - hh * 0.12, ww * 0.28, hh * 0.13, 0, 0, Math.PI * 2); g.fill();
      x += w;
    }
  }
  for (let i = 0; i < 14000; i++) { g.fillStyle = `rgba(${r() < .5 ? '0,0,0' : '255,255,255'},${r() * 0.06})`; g.fillRect(r() * s, r() * s, 1 + r() * 2, 1 + r() * 2); }
  for (let i = 0; i < 260; i++) { g.fillStyle = `rgba(20,18,22,${0.3 + r() * 0.4})`; g.beginPath(); g.arc(r() * s, r() * s, 1 + r() * 2.5, 0, Math.PI * 2); g.fill(); }
});
M.tex.plaster = () => canvasTex('plaster', 512, (g, s) => {
  const r = M.rand(11), img = g.createImageData(s, s), d = img.data;
  for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
    const u = x / s, v = y / s;
    const n = M.noiseP(u * 4, v * 4, 4) * 0.55 + M.noiseP(u * 11, v * 11, 11) * 0.3 + M.noiseP(u * 37, v * 37, 37) * 0.15;
    const streak = Math.max(0, M.noiseP(u * 48, 0.5, 48) - 0.55) * 2.2 * (1 - v) ** 1.5;
    const damp = Math.max(0, (v - 0.8) / 0.2) ** 1.6 * (0.6 + 0.4 * M.noiseP(u * 9, v * 3, 9));
    let k = 0.86 + (n - 0.5) * 0.22 - streak * 0.12 - damp * 0.3 + (r() - 0.5) * 0.05;
    k = Math.max(0, Math.min(1, k)); const i = (y * s + x) * 4;
    d[i] = 255 * k; d[i + 1] = 252 * k; d[i + 2] = 246 * k; d[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
});
M.tex.planks = () => canvasTex('planks', 256, (g, s) => {
  const r = M.rand(31); g.fillStyle = '#fff'; g.fillRect(0, 0, s, s);
  const n = 8, ph = s / n;
  for (let i = 0; i < n; i++) {
    const k = 0.82 + r() * 0.18; g.fillStyle = `rgba(${255 * k | 0},${246 * k | 0},${232 * k | 0},1)`; g.fillRect(0, i * ph, s, ph);
    for (let y = 0; y < ph; y += 2) { g.fillStyle = `rgba(70,40,18,${0.05 + 0.12 * M.noise2(y * 0.2 + i * 7, i)})`; g.fillRect(0, i * ph + y, s, 1); }
    g.fillStyle = 'rgba(25,12,5,0.65)'; g.fillRect(0, i * ph, s, 2);
    for (let x = 12 + r() * 20; x < s; x += 40 + r() * 30) { g.fillStyle = 'rgba(30,20,15,0.6)'; g.fillRect(x, i * ph + ph / 2 - 1, 2, 2); }
  }
});
M.tex.wood = () => canvasTex('wood', 256, (g, s) => {
  const r = M.rand(3); g.fillStyle = '#fff'; g.fillRect(0, 0, s, s);
  for (let y = 0; y < s; y += 2) { g.fillStyle = `rgba(60,35,15,${0.08 + 0.18 * M.noise2(y * 0.05, 0.5) + r() * 0.05})`; g.fillRect(0, y, s, 1.5); }
  for (let y = 0; y < s; y += 32) { g.fillStyle = 'rgba(20,10,5,0.5)'; g.fillRect(0, y, s, 2); }
});
M.tex.stone = () => canvasTex('stone', 512, (g, s) => {
  const r = M.rand(5); g.fillStyle = '#222'; g.fillRect(0, 0, s, s);
  const bh = s / 8;
  for (let y = 0; y < 8; y++) for (let x = -1; x < 5; x++) {
    const ox = (y % 2) * s / 8; g.fillStyle = `hsl(25,${8 + r() * 8}%,${38 + r() * 18}%)`;
    g.fillRect(x * s / 4 + ox + 3, y * bh + 3, s / 4 - 6, bh - 6);
  }
});
M.tex.soft = () => canvasTex('soft', 128, (g, s) => {
  const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.35, 'rgba(255,255,255,0.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
}, { clamp: true, srgb: false });
M.tex.frost = () => canvasTex('frost', 1024, (g, s) => {
  const r = M.rand(21); g.fillStyle = '#000'; g.fillRect(0, 0, s, s);
  g.strokeStyle = 'rgba(255,255,255,0.32)'; g.lineCap = 'round';
  const branch = (x, y, a, len, w, d) => {
    if (d > 6 || len < 4) return;
    const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len;
    g.lineWidth = w; g.beginPath(); g.moveTo(x, y); g.lineTo(x2, y2); g.stroke();
    branch(x2, y2, a + (r() - .5) * .5, len * .8, w * .8, d + 1);
    if (r() < .7) branch(x2, y2, a + (r() < .5 ? 1 : -1) * (.5 + r() * .6), len * .55, w * .6, d + 1);
  };
  for (let i = 0; i < 260; i++) {
    const e = r() * 4 | 0, t = r() * s, x = e === 0 ? 0 : e === 1 ? s : t, y = e === 2 ? 0 : e === 3 ? s : (e < 2 ? t : t);
    const a = Math.atan2(s / 2 - y, s / 2 - x) + (r() - .5) * 1.2;
    branch(e < 2 ? x : t, e < 2 ? t : y, a, 18 + r() * 40, 2.2, 0);
  }
  g.filter = 'blur(2.5px)'; g.drawImage(g.canvas, 0, 0);
}, { clamp: true, srgb: false });

// ---- 材质 ----
M.mat = {};
const _matCache = {};
M.mat.std = (color, rough = 0.85, opts = {}) => {
  const key = color + '|' + rough + '|' + (opts.map ? opts.map.uuid : '') + (opts.key || '');
  if (_matCache[key] && !opts.unique) return _matCache[key];
  const m = new T.MeshStandardMaterial({ color: M.col(color), roughness: rough, metalness: opts.metal || 0, map: opts.map || null,
    flatShading: !!opts.flat, side: opts.side || T.FrontSide });
  if (opts.emissive) { m.emissive = M.col(opts.emissive); m.emissiveIntensity = opts.ei ?? 1; }
  return opts.unique ? m : (_matCache[key] = m);
};
M.mat.emissive = (color, intensity = 1) => new T.MeshBasicMaterial({ color: M.col(color).multiplyScalar(intensity) });
M.mat.snow = M.mat.std('#e4ebf7', 0.62);

// ---- 可行走区域与碰撞 ----
M.colliders = [];
M.walkable = (x, z) =>
  (x >= -3.5 && x <= 5.6 && z >= -44 && z <= 18) ||
  (x >= -12 && x <= 22 && z >= -64 && z <= -44) ||
  (x >= 5.6 && x <= 14.4 && z >= -21.3 && z <= -18.7) ||
  (x >= 14.4 && x <= 16 && z >= -44 && z <= 28);
M.groundY = () => 0;
M.collide = (p, r) => {
  for (const c of M.colliders) {
    const dx = p.x - c.x, dz = p.z - c.z, d = Math.hypot(dx, dz), m = c.r + r;
    if (d < m && d > 1e-4) { p.x = c.x + dx / d * m; p.z = c.z + dz / d * m; }
  }
};

// ---- 输入：点击 / 拖动 / 缩放 ----
M.input = { _tap: [], _drag: [], _zoom: [] };
M.input.onTap = f => M.input._tap.push(f);
M.input.onDrag = f => M.input._drag.push(f);
M.input.onZoom = f => M.input._zoom.push(f);
(() => {
  const el = M.renderer.domElement, pts = new Map();
  let down = null, pinch = 0;
  el.addEventListener('pointerdown', e => {
    el.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) down = { x: e.clientX, y: e.clientY, t: performance.now(), moved: 0 };
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); down = null; }
  });
  el.addEventListener('pointermove', e => {
    const p = pts.get(e.pointerId); if (!p) return;

    uniform sampler2D tSrc; uniform vec2 uTexel; uniform float uThresh; varying vec2 vUv;
    void main(){

      c *= .25;
      if (uThresh > 0.) { float l = max(c.r, max(c.g, c.b)); float k = smoothstep(uThresh-.5, uThresh+.5, l); c *= k; }

    tScene: { value: rtScene.texture }, tDepth: { value: rtScene.depthTexture },
    tBloomA: { value: rtA.texture }, tBloomC: { value: rtC.texture }, tDof: { value: rtE.texture },

    uCold: { value: 0.3 }, uWarm: { value: 0 }, uDawn: { value: 0 }, uFocus: { value: 9 }, uWhite: { value: 0 },

// ===== 06b-firgen.js：冷杉生成器（枝条卡片实例化 + 积雪卡片 + 针叶形阴影）=====
(() => {
  const PI = Math.PI;
  const needleTex = M.canvasTex('needles', 256, (g, s) => {
    const r = M.rand(31), H = s / 2, cy = H / 2;
    g.clearRect(0, 0, s, s);
    const greens = ['#2a5f40', '#36704b', '#204d35', '#457f57'];
    const twig = (x0, y0, x1, y1, len, n) => {
      g.strokeStyle = '#4a3624'; g.lineWidth = 2; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
      for (let i = 0; i < n; i++) {
        const t = i / n, x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t, l = len * (1 - t * 0.55) * (0.7 + r() * 0.5);
        if (t < 0.1 && r() < 0.6) continue;
        g.strokeStyle = greens[(r() * 4) | 0]; g.lineWidth = 3 + r() * 1.5;
        for (const sd of [-1, 1]) { const a = Math.atan2(y1 - y0, x1 - x0) + sd * (0.9 + r() * 0.4);
          g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
      }
    };
    twig(0, cy, s, cy, H * 0.46, 110);
    for (let k = 0; k < 5; k++) { const x = s * (0.18 + k * 0.15), sd = k % 2 ? 1 : -1;
      twig(x, cy, x + s * 0.22, cy + sd * H * 0.34, H * 0.24, 26); }
  }, { clamp: true });
  const snowTex = M.canvasTex('branchSnow', 256, (g, s) => {
    const r = M.rand(57), H = s / 2, cy = H / 2; g.clearRect(0, 0, s, s);
    for (let i = 0; i < 26; i++) {
      const x = s * (0.1 + r() * 0.85), y = cy + (r() - 0.5) * H * 0.5 * (1 - x / s * 0.5), rr = 12 + r() * 16 * (1 - x / s * 0.6);
      const n = 6 + ((r() * 4) | 0);
      for (let j = 0; j < n; j++) {
        const a = r() * PI * 2, d = r() * rr * 0.8, cx = x + Math.cos(a) * d * 1.4, cy2 = y + Math.sin(a) * d * 0.7, r2 = rr * (0.3 + r() * 0.35);
        const gr = g.createRadialGradient(cx, cy2, 0, cx, cy2, r2); gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.75, '#eef3ff'); gr.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = gr; g.beginPath(); g.arc(cx, cy2, r2, 0, PI * 2); g.fill();
      }
    }
  }, { clamp: true });

  // 枝条几何：沿 +X，中脉折起，枝梢下垂；UV 只用贴图上半
  const branchGeo = (() => {
    const g = new T.PlaneGeometry(1, 0.62, 5, 2); g.rotateX(-PI / 2); g.translate(0.5, 0, 0);
    const p = g.attributes.position, uv = g.attributes.uv;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), z = p.getZ(i), w = 1 - Math.abs(z) / 0.31;
      p.setY(i, w * 0.08 * (1 - x * 0.6) - 0.18 * x * x);
      p.setZ(i, z * (1 - x * 0.45));
      uv.setY(i, 0.5 + uv.getY(i) * 0.5);
    }
    g.computeVertexNormals(); return g;
  })();
  const mkMat = (map, color, rough) => {
    const m = new T.MeshStandardMaterial({ map, color: M.col(color), roughness: rough, alphaTest: 0.45, side: T.DoubleSide });
    return m;
  };
  const leafMat = mkMat(needleTex, '#ffffff', 0.9), snowMat = mkMat(snowTex, '#e8eefb', 0.6);
  const depthOf = map => new T.MeshDepthMaterial({ depthPacking: T.RGBADepthPacking, map, alphaTest: 0.45 });

  const leaves = [], snows = [], cores = [];
  const q = new T.Quaternion(), e = new T.Euler(), v = new T.Vector3(), sc = new T.Vector3();
  M.firgen = {};
  M.firgen.tree = (x, z, h, opts = {}) => {
    const r = M.rand(opts.seed || (x * 131 + z * 17) | 0), Rb = opts.radius || h * 0.33, tips = [];
    const whorls = Math.round(h * 2.4), per = opts.per || (h > 7 ? 11 : 8);
    const branch = (y, yaw, len, droop, shade, snowy) => {
      e.set((r() - 0.5) * 0.4, yaw, -droop, 'YZX'); q.setFromEuler(e);
      const m = new T.Matrix4().compose(v.set(x, y, z), q, sc.set(len, len * 0.9, len * (0.8 + r() * 0.3)));
      leaves.push({ m, c: shade });
      if (snowy) { const ms = m.clone(); ms.multiply(new T.Matrix4().makeTranslation(0.04, 0.045, 0)).multiply(new T.Matrix4().makeScale(0.9, 1, 0.85)); snows.push(ms); }
      const tip = new T.Vector3(1, -0.18, 0).applyMatrix4(m); tips.push(tip);
    };
    for (let i = 0; i < whorls; i++) {
      const t = i / whorls, y = h * (0.16 + t * 0.8), R = Rb * Math.pow(1 - t, 0.85) + 0.15, rot = r() * PI * 2;
      const n = Math.max(4, Math.round(per * (1 - t * 0.5)));
      for (let k = 0; k < n; k++) {
        const yaw = rot + k / n * PI * 2 + (r() - 0.5) * 0.3, droop = 0.22 + 0.35 * (1 - t) + r() * 0.1;
        branch(y, yaw, R * (0.85 + r() * 0.25), droop, 0.55 + 0.4 * t + r() * 0.08, r() < 0.3 + 0.35 * t);
        if (r() < 0.6) branch(y - h * 0.18 / whorls, yaw + PI / n, R * 0.6, droop + 0.1, 0.45 + 0.35 * t, false);
      }
    }
    cores.push({ x, z, h, r: Math.max(0.15, h * 0.11) });
    M.colliders.push({ x, z, r: opts.collide || h * 0.11 + 0.25 });
    return { tips };
  };
  M.firgen.flush = () => {
    const li = new T.InstancedMesh(branchGeo, leafMat, leaves.length), col = new T.Color();
    leaves.forEach((b, i) => { li.setMatrixAt(i, b.m); li.setColorAt(i, col.setRGB(b.c * 0.95, b.c, b.c * 0.92)); });
    li.instanceColor.needsUpdate = true; li.castShadow = li.receiveShadow = true; li.customDepthMaterial = depthOf(needleTex);
    M.scene.add(li);
    const si = new T.InstancedMesh(branchGeo, snowMat, Math.max(1, snows.length));
    snows.forEach((m, i) => si.setMatrixAt(i, m)); si.count = snows.length; si.receiveShadow = true; M.scene.add(si);
    const coreGeo = new T.ConeGeometry(1, 1, 10), coreMat = M.mat.std('#122a1e', 0.95), trunk = M.mat.std('#3a2618', 0.9);
    const trunkGeo = new T.CylinderGeometry(0.6, 1, 1, 8);
    for (const c of cores) {
      M.batch.add(coreGeo, coreMat, M.mtx(c.x, c.h * 0.58, c.z, 0, 0, 0, c.r * 0.6, c.h * 0.8, c.r * 0.6));
      M.batch.add(trunkGeo, trunk, M.mtx(c.x, c.h * 0.1, c.z, 0, 0, 0, c.r * 0.35, c.h * 0.2, c.r * 0.35));
    }
    M.firgen.mesh = li;
  };
})();

      if (seq.i % 3 === 0 && b >= 1) box(m + seq.up - 12, seq.t, seq.g * 0.45, musicIn);
      seq.t += b * seq.beat; seq.i++;
      if (seq.i >= SN.length) { if (seq.once) { seq = null; break; } seq.i = 0; seq.t += 4; }
    }
    const S = M.story, cold = S ? S.cold : 0.3, dawn = S ? S.dawn : 0;
    const warmth = Math.max(dawn, Math.pow(M.clamp(1 - cold + (S && S.flame ? 0.15 : 0), 0, 1), 1.5));
    musicLP.frequency.setTargetAtTime(900 + 7000 * warmth, now(), 1.0);
    const G = M.girl, cd = G.pos.z > -44 ? (G.pos.x < 6 ? 6 - G.pos.x : G.pos.x > 14 ? G.pos.x - 14 : 0) : 99;
    const lap = 0.6 + 0.4 * Math.sin(M.time * 0.9) * Math.sin(M.time * 0.37 + 1);
    waterG.gain.setTargetAtTime(0.06 * M.smooth(9, 0.5, cd) * lap * (1 - dawn * 0.5), now(), 0.4);
    waterF.frequency.setTargetAtTime(300 + 160 * Math.sin(M.time * 0.53), now(), 0.3);
    wind.gain.setTargetAtTime((0.025 + cold * 0.07) * (1 - dawn * 0.8), now(), 0.5);
    windF.frequency.setTargetAtTime(420 + Math.sin(M.time * 0.23) * 180 + Math.sin(M.time * 0.71) * 90, now(), 0.3);
    if (fireOn) { const st = M.props.stove.pos, d = Math.hypot(M.girl.pos.x - st.x, M.girl.pos.z - st.z), k = M.smooth(12, 1.5, d);
      fireG.gain.setTargetAtTime(0.1 * k, now(), 0.3);
      if (Math.random() < 0.08 * k) burst(0.02, 'highpass', 2500 + Math.random() * 3000, 0.12 * k, -0.2 + Math.random() * 0.4); }
    if (flameG.gain.value > 0.01 && Math.random() < 0.05) burst(0.015, 'highpass', 4000, 0.05);
  }, 95);
})();
// ===== 14-ui-main.js：环境光、界面、开场、自适应质量、主循环 =====
(() => {
  const G = M.girl, $ = id => document.getElementById(id);
  // ---- 月光 + 天光 ----
  const moon = new T.DirectionalLight(M.col('#a9b9e6'), 0.75);
  moon.castShadow = true; moon.shadow.mapSize.set(2048, 2048);
  Object.assign(moon.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 90 });
  moon.shadow.bias = -0.0006; moon.shadow.normalBias = 0.03;
  M.scene.add(moon, moon.target);
  const hemi = new T.HemisphereLight(M.col('#6a7aac'), M.col('#3a3540'), 0.9); M.scene.add(hemi);
  M.env = { moon, hemi };
  // 阴影相机按阴影贴图像素对齐，避免跟随移动时阴影边缘"爬动"闪烁
  const lightRot = new T.Matrix4().lookAt(new T.Vector3(-14, 30, 12), new T.Vector3(0, 0, 0), new T.Vector3(0, 1, 0));
  const lightInv = lightRot.clone().invert(), texel = 36 / 2048, sp = new T.Vector3();
  M.onFrame(() => {
    sp.copy(M.cam.target).setY(0).applyMatrix4(lightInv);
    sp.x = Math.round(sp.x / texel) * texel; sp.y = Math.round(sp.y / texel) * texel;
    sp.applyMatrix4(lightRot);
    moon.position.set(sp.x - 14, sp.y + 30, sp.z + 12); moon.target.position.copy(sp); moon.target.updateMatrixWorld();
  }, 75);

  // ---- 界面 ----
  let hintTimer = 0, capTimer = null;
  M.ui = {
    hint(text, soft) {
      const h = $('hint'); if (h.textContent === text) return;
      if (soft && performance.now() < hintTimer) return;
      h.classList.add('hide'); setTimeout(() => { h.textContent = text; h.classList.remove('hide'); }, 350);
      hintTimer = performance.now() + 6000;
    },
    caption(title, lines, dur = 6.5) {
      const c = $('caption'), esc = s => s.replace(/</g, '&lt;');
      c.querySelector('.t').innerHTML = `<span class="ln">${esc(title)}</span>`;
      c.querySelector('.l').innerHTML = lines.map((l, i) => `<span class="ln" style="animation-delay:${0.35 + i * 0.75}s">${esc(l)}</span>`).join('');
      c.classList.remove('hide'); clearTimeout(capTimer); capTimer = setTimeout(() => c.classList.add('hide'), dur * 1000);
    },
    hideCaption() { clearTimeout(capTimer); $('caption').classList.add('hide'); },
    cinema(on) { document.body.classList.toggle('cine', !!on); },
    action(label) {
      const b = $('action');
      if (!label) { b.classList.add('hide'); return; }
      if (b.textContent !== label) b.textContent = label;
      b.classList.remove('hide');
    },
    setMatches(n) { [...$('matches').children].forEach((el, i) => el.classList.toggle('used', i >= n)); },
    setClock(s) { $('clock').textContent = s; },
    ending() { $('hud').classList.add('hide'); M.ui.cinema(false); $('ending').classList.remove('hide'); },
  };
  $('action').addEventListener('click', () => M.story.strike());
  $('again').addEventListener('click', () => location.reload());
  const toggleMute = () => { const m = !M.audio.isMuted(); M.audio.setMuted(m); $('mute').classList.toggle('off', m); };
  $('mute').addEventListener('click', toggleMute);
  addEventListener('keydown', e => {
    if (e.code === 'KeyM') toggleMute();
    if (e.code === 'Space' && !$('action').classList.contains('hide')) { e.preventDefault(); M.story.strike(); }
  });

  // ---- 开场 ----
  const q = new URLSearchParams(location.search);
  M.cam.override = { target: new T.Vector3(3, 2, -8), dist: 34, yaw: 0, pitch: 0.55, rate: 1 };
  M.cam.yaw = 0.3; M.cam.pitch = 0.55; M.cam.dist = 34; M.cam.target.set(3, 2, -8);
  let introSpin = true;
  M.onFrame(dt => { if (introSpin && M.cam.override) M.cam.override.yaw += dt * 0.04; }, 65);
  const start = async () => {
    M.audio.init();
    $('intro').classList.add('hide'); $('hud').classList.remove('hide');
    introSpin = false;
    M.cam.focus({ target: new T.Vector3(G.pos.x, 0.9, G.pos.z), dist: 9, yaw: 0, pitch: 0.5, rate: 0.9 });
    await M.wait(2.6);
    M.cam.release(); M.cam.tYaw = 0; M.cam.tPitch = 0.5; M.cam.tDist = 9;
    M.story.start();
    if (q.has('debug')) { window.M = M; const n = +q.get('debug'); if (n > 0) M.debug.jump(n); }
  };
  $('start').addEventListener('click', start);
  if (q.has('auto')) setTimeout(start, 300);

  // ---- 尺寸与质量 ----
  const resize = () => {
    M.camera.aspect = innerWidth / innerHeight;
    M.camera.fov = M.camera.aspect < 1 ? 50 + Math.min(1, (1 - M.camera.aspect) / 0.55) * 14 : 50;
    M.camera.updateProjectionMatrix();
    M.renderer.setSize(innerWidth, innerHeight); M.post.resize();
  };
  addEventListener('resize', resize); resize();
  let fpsAcc = 0, fpsN = 0, good = 0;
  const quality = dt => {
    fpsAcc += dt; fpsN++;
    if (fpsAcc < 1) return;
    const fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0;
    if (fps < 40 && M.pixelScale > 0.6) { M.pixelScale = Math.max(0.6, M.pixelScale - 0.15); good = 0; }
    else if (fps > 57 && M.pixelScale < 1) { if (++good >= 3) { M.pixelScale = Math.min(1, M.pixelScale + 0.1); good = 0; } else return; }
    else return;
    M.quality = M.pixelScale >= 0.9 ? 1 : M.pixelScale >= 0.7 ? 0.5 : 0.3;
    M.setPixelRatio(); M.post.resize();
  };

  // ---- 主循环 ----
  let last = performance.now(), first = true;
  const loop = t => {
    const dt = Math.min(0.05, (t - last) / 1000) * (M.timeScale ?? 1); last = t;
    M.dt = dt; M.time += dt;
    for (const f of M._frames) f.fn(dt);
    M.post.render();
    if (first) { first = false; const b = $('start'); b.disabled = false; b.textContent = '点亮第一根火柴'; }
    quality(dt);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();

</script>
